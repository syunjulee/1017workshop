function myMonster(extra){const self=S.hatch.self,o=revealOrder(self);const blind=o.filter(x=>x.zone==='blind').map(x=>x.id);const hidden=o.filter(x=>x.zone==='hidden').map(x=>x.id);

  const m={stage:st,features:self,colors:PARTNER.map(id=>C[id].color),auras:(st==='egg'||(v&&!v.aura))?[]:activeAI().map(id=>({id,disputed:!!S.hatch.disputed[id]||S.meta?.aiChoices?.[id]==='reject'})),back,embrace:blind.length?[]:(v?[]:hidden),fullGlow:o.every(x=>x.zone==='consensus'),item:itemNow(),skills:skillLevels(),

const WAY=[];for(let x=80;x<=1060;x+=70)WAY.push({x,y:RY+(x%3)*6-6});

const me={x:S.pos.x,y:S.pos.y,path:[],face:1,pending:null};me.el=mkEnt('me','你');

function routeTo(t){const p=[];if(Math.abs(me.y-RY)>8)p.push({x:me.x,y:RY});if(Math.abs(t.y-RY)>8)p.push({x:t.x,y:RY});p.push({x:t.x,y:t.y});return p}
function walkTo(id){const s=SPOTS[id];S.open=null;closeNpc();render();if(Math.hypot(me.x-s.dx,me.y-s.dy)<12){openSpot(id);return}me.path=routeTo({x:s.dx,y:s.dy});me.pending=id}

let cam={x:0,y:0,s:1},keys={},nearSpot=null,lastT=performance.now();
function tick(now){const dt=Math.min(.05,(now-lastT)/1000);lastT=now;
  const mvx=(keys.ArrowRight||keys.d?1:0)-(keys.ArrowLeft||keys.a?1:0),mvy=(keys.ArrowDown||keys.s?1:0)-(keys.ArrowUp||keys.w?1:0);let moving=false;
  if((mvx||mvy)&&!S.open){me.path=[];me.pending=null;const l=Math.hypot(mvx,mvy);me.x+=mvx/l*SPD*dt;me.y+=mvy/l*SPD*dt;if(mvx)me.face=mvx;moving=true}
  else if(me.path.length){const t=me.path[0],dx=t.x-me.x,dy=t.y-me.y,d=Math.hypot(dx,dy),st=SPD*dt;
    if(d<=st){me.x=t.x;me.y=t.y;me.path.shift();if(!me.path.length&&me.pending){const id=me.pending;me.pending=null;openSpot(id)}}
    else{me.x+=dx/d*st;me.y+=dy/d*st;if(Math.abs(dx)>1)me.face=Math.sign(dx)}moving=true}
  me.x=clamp(me.x,24,W-24);me.y=clamp(me.y,70,H-8);place(me,moving);
  npcs.forEach(n=>{let mv=false;if(MOTION){if(n.pause>0)n.pause-=dt;else{const dx=n.tx-n.x,dy=n.ty-n.y,d=Math.hypot(dx,dy),st=48*dt;
      if(d<=st){n.x=n.tx;n.y=n.ty;n.pause=1.5+Math.random()*4;if(n.goal){n.goal=null}else{const w=WAY[Math.floor(Math.random()*WAY.length)];n.tx=w.x+(Math.random()*30-15);n.ty=w.y+(Math.random()*16-8)}}
      else{n.x+=dx/d*st;n.y+=dy/d*st;if(Math.abs(dx)>.5)n.face=Math.sign(dx);mv=true}}
    n.talk-=dt;if(n.talk<=0){n.talk=9+Math.random()*12;if(!S.open)say(n,esc(n.quote.length>13?n.quote.slice(0,13)+'…':n.quote),3200)}}
    place(n,mv)});
  nearSpot=null;if(!me.path.length&&!S.open){for(const [id,s] of Object.entries(SPOTS))if(Math.hypot(me.x-s.dx,me.y-s.dy)<48){nearSpot=id;break}}
  updateHint();
  const tw=town.clientWidth,th=town.clientHeight;const sc=clamp(Math.max(tw/W,th/H)*0.98,0.62,1.05);cam.s=sc;
  cam.x=W*sc<=tw?(W*sc-tw)/2:clamp(me.x*sc-tw/2,0,W*sc-tw);cam.y=H*sc<=th?(H*sc-th)/2:clamp(me.y*sc-th/2,0,H*sc-th);
  world.style.transform=`translate(${(-cam.x).toFixed(1)}px,${(-cam.y).toFixed(1)}px) scale(${sc})`;
  requestAnimationFrame(tick)}
let hintKey='';

  else if(key==='idle')h.innerHTML=`<span>點建築物，小怪獸會走過去；也可以點草地，或用方向鍵、WASD 移動。點其他小怪獸可以打招呼。</span>`;

    case'careerReset':S.career.guess=null;break;
    case'postPlaza':if(!S.plaza.answer.trim()){toast('先寫一句你的回答');return}S.plaza.posted=true;say(me,ICON.spark);break;
    case'dojoLock':S.dojo.step='partners';break;
    case'dojoAI':S.dojo.step='ai';break;
    case'dojoWrong':S.dojo.aiWrong=true;S.aiWrong=(S.aiWrong||0)+1;break;
    case'dojoReset':S.dojo={q:'',mine:'',step:'write',final:null,aiWrong:false};break;
    case'hint':S.quest.hint=true;break;
    case'submitQuest':S.quest.phase='pending';break;
    case'feedbackArrive':S.quest.phase='feedback';break;
    case'questBack':S.quest.phase='list';S.quest.active=null;break;
    case'gotoDaily':S.card.tab='daily';S.quest.phase='list';walkTo('home');return;
    case'snap':S.photo={names:npcs.filter(n=>Math.hypot(n.x-SPOTS.photo.dx,n.y-SPOTS.photo.dy)<300).map(n=>n.name),d:new Date().toLocaleDateString('zh-TW')};addDiary('在照相亭和'+(S.photo.names.join('、')||'自己')+'拍了一張同框照。');break;
    case'photoAgain':S.photo=null;break;
    case'reset':{S=fresh();me.x=S.pos.x;me.y=S.pos.y;me.path=[];toast('已清除，從頭開始');break}
    default:return}
  render()});

setInterval(()=>{S.pos={x:Math.round(me.x),y:Math.round(me.y)};save()},2000);
render();town.focus({preventScroll:true});requestAnimationFrame(tick);
</script>
